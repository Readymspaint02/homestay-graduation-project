# 项目相关配置
ruoyi:
  # 名称
  name: 若依管理系统
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（Windows 配置 D:/ruoyi/uploadPath，Linux 配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 上传路径
  path:
    uploadPath: D:/ruoyi/uploadPath/
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的 HTTP 端口，默认为 8080
  port: 8083
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat 的 URI 编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认 100
    accept-count: 1000
    threads:
      # tomcat 最大线程数，默认为 200
      max: 800
      # Tomcat 启动初始化的线程数，默认 10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# Spring 配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: devmy
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 100MB
      # 设置总上传的文件大小
      max-request-size: 200MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # Redis 配置（必须放在主配置文件中，确保自动配置生效）
  redis:
    # 地址
    host: 127.0.0.1
    # 端口，默认为 6379
    port: 6379
    # 数据库索引
    database: 1
    # 密码
    password:
    # 连接超时时间
    timeout: 5s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 10
        # 连接池中的最大空闲连接
        max-idle: 50
        # 连接池的最大数据库连接数
        max-active: 100
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: 5s
      shutdown-timeout: 100ms

# token 配置
token:
  # 是否允许多端登录（true 表示允许，false 表示不允许）
  singleLogin: true
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: your-jwt-secret
  # 令牌有效期（默认 1 年）
  expireTime: 525600

# MyBatis 配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置 mapper 的扫描，找到所有的 mapper.xml 映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# Swagger 配置
swagger:
  # 是否开启 swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止 XSS 攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 多租户配置
tenant:
  enable: false
  column: tenant_id
  filterTables:
  ignoreTables:
    - QRTZ_BLOB_TRIGGERS
    - QRTZ_CALENDARS
    - QRTZ_CRON_TRIGGERS
    - QRTZ_FIRED_TRIGGERS
    - QRTZ_JOB_DETAILS
    - QRTZ_LOCKS
    - QRTZ_PAUSED_TRIGGER_GRPS
    - QRTZ_SCHEDULER_STATE
    - QRTZ_SIMPLE_TRIGGERS
    - QRTZ_SIMPROP_TRIGGERS
    - QRTZ_TRIGGERS
    - gen_table
    - gen_table_column
    - sys_config
    - sys_dept
    - sys_dict_data
    - sys_dict_type
    - sys_job
    - sys_job_log
    - sys_logininfor
    - sys_menu
    - sys_notice
    - sys_oper_log
    - sys_post
    - sys_role
    - sys_role_dept
    - sys_role_menu
    - sys_user
    - sys_user_post
    - sys_user_role
    - biz_region
  ignoreLoginNames:
    - admin

# OpenAI 配置
openai:
  # API 密钥
  api-key: your-api-key
  # 基础 URL
  base-url: https://api.deepseek.com/v1
  # 默认模型
  model: deepseek-chat
  # 代理配置
  proxy:
    # 是否启用代理
    enabled: false
    # 代理类型 (HTTP/SOCKS)
    type: HTTP
    # 代理主机
    host: 127.0.0.1
    # 代理端口
    port: 7890

# magic-api 配置
magic-api:
  web: /magic/web
  editor-config: classpath:./magic-editor-config.js
  resource:
    type: database
    tableName: magic_api_file
  prefix: /magic/api
  security:
    username: admin
    password: your-password
  backup:
    enable: true
    max-history: -1
    table-name: magic_backup_record
  response: |-
    {
      code: code,
      msg: message,
      data,
    }

# 支付宝沙箱配置
alipay:
  app-id: your-alipay-app-id
  app-private-key: your-alipay-app-private-key
  alipay-public-key: your-alipay-public-key
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://localhost:8083/api/order/pay/alipay/notify
  return-url: http://localhost:3000/index/pay
  sign-type: RSA2
  charset: UTF-8
  format: json

# 七牛云图片存储配置
qiniu:
  enabled: true
  access-key: your-qiniu-access-key
  secret-key: your-qiniu-secret-key
  bucket: your-qiniu-bucket
  domain: https://your-qiniu-domain
  upload-url: https://up-z2.qiniup.com

# 阿里短信配置
alisms:
  key: your_access_key_id
  secret: your_access_key_secret
  sign: your_sign_name
  templates:
    - your_template_code

# 二次验证配置
secondary-verification:
  enabled: false

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,undsky.com,www.undsky.com
